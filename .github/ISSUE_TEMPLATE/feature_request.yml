name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Before you write this, check docs/SRS.md. The feature may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation and who runs into it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Mobile app
        - Backend (Supabase)
        - Website
        - Documentation
        - Not sure
