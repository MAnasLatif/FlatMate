version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Expo, React and React Native versions are tied to the Expo SDK and are
  # upgraded together with `npx expo install --fix`, not one at a time.
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    ignore:
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: '@react-native-async-storage/async-storage'
      - dependency-name: '@types/react'
      - dependency-name: 'typescript'
      - dependency-name: 'jest-expo'
      - dependency-name: 'eslint-config-expo'
      # HeroUI Native declares these as peer dependencies with a fixed major.
      # A new major breaks `npm ci` until HeroUI Native supports it.
      - dependency-name: 'tailwind-variants'
        update-types: ['version-update:semver-major']
      - dependency-name: 'tailwind-merge'
        update-types: ['version-update:semver-major']
      - dependency-name: '@gorhom/bottom-sheet'
        update-types: ['version-update:semver-major']
      # The plugins inside eslint-config-expo decide which ESLint major works.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']

  # Add an npm entry for /web once it has a package.json.
